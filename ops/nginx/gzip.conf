# Loaded in the http context through /etc/nginx/conf.d/hot-hair-gzip.conf.
gzip on;
gzip_vary on;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/json
    application/javascript
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
